<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汉釉小守 · 汉代绿釉陶狗文化互动</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            background: #f3ebd8;
            color: #2d2a23;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ================= 页面容器 ================= */
        .page {
            display: none; /* 默认隐藏，通过 JS 控制显示 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            animation: fadeIn 0.4s ease;
        }
        .page.active {
            display: flex; /* 当前页面显示 */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= 封面页 ================= */
        .main-title {
            font-size: 44px;
            font-weight: 700;
            color: #2c3e22;
            letter-spacing: 10px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            margin-bottom: 20px;
        }
        .sub-title {
            font-size: 14px;
            color: #5a6b4e;
            letter-spacing: 3px;
            margin-bottom: 60px;
        }

        /* ================= 通用按钮 ================= */
        .btn {
            padding: 12px 40px;
            border: 1px solid #2c3e22;
            border-radius: 30px;
            background: transparent;
            color: #2c3e22;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn:active {
            background: #2c3e22;
            color: #f3ebd8;
            transform: scale(0.96);
        }
        .btn-primary {
            background: #2c3e22;
            color: #f3ebd8;
        }
        .btn-primary:active {
            background: #4a5e3a;
        }

        /* ================= 标题与文字 ================= */
        .section-title {
            font-size: 22px;
            color: #2c3e22;
            letter-spacing: 4px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .text-content {
            font-size: 15px;
            line-height: 2.2;
            color: #3d3a31;
            text-align: center;
            max-width: 320px;
            margin-bottom: 30px;
        }
        .img-placeholder {
            width: 180px;
            height: 220px;
            border: 1px solid #c2b48e;
            border-radius: 8px;
            background: #efe8d4;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b7d5a;
            font-size: 13px;
            margin-bottom: 24px;
        }

        /* ================= 陶狗 CSS 造型 ================= */
        .dog-stage {
            width: 220px;
            height: 240px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .dog {
            position: relative;
            width: 130px;
            height: 170px;
            transition: all 0.5s ease;
        }
        .dog-body {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 95px;
            border-radius: 45px 45px 35px 35px;
            transition: background 0.5s ease;
        }
        .dog-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 85px;
            border-radius: 50%;
            transition: background 0.5s ease;
            z-index: 2;
        }
        .dog-ear {
            position: absolute;
            top: -15px;
            width: 22px;
            height: 40px;
            border-radius: 11px 11px 0 0;
            transition: background 0.5s ease;
            z-index: 1;
        }
        .dog-ear.left { left: 14px; transform: rotate(-12deg); }
        .dog-ear.right { right: 14px; transform: rotate(12deg); }
        
        .dog-collar {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
            z-index: 3;
        }
        .dog-leg {
            position: absolute;
            bottom: 0;
            width: 18px;
            height: 38px;
            border-radius: 9px;
            transition: background 0.5s ease;
            z-index: 0;
        }
        .dog-leg.fl { left: 24px; }
        .dog-leg.fr { right: 24px; }
        .dog-leg.bl { left: 38px; }
        .dog-leg.br { right: 38px; }

        /* 釉色配色 */
        .glaze-clay .dog-body, .glaze-clay .dog-head, .glaze-clay .dog-ear { background: linear-gradient(180deg, #e0b98d, #c49463); }
        .glaze-clay .dog-leg { background: #cf9f6d; }
        .glaze-green .dog-body, .glaze-green .dog-head, .glaze-green .dog-ear { background: linear-gradient(180deg, #8ab934, #5a7a1b); }
        .glaze-green .dog-leg { background: #6d9422; }
        .glaze-yellow .dog-body, .glaze-yellow .dog-head, .glaze-yellow .dog-ear { background: linear-gradient(180deg, #bce455, #84b11e); }
        .glaze-yellow .dog-leg { background: #9ac52c; }

        /* 纹饰配色 */
        .pattern-plain .dog-collar { background: #8b4513; }
        .pattern-cloud .dog-collar { background: repeating-linear-gradient(90deg, #8b4513 0px, #8b4513 8px, #b06a28 8px, #b06a28 16px); }
        .pattern-whorl .dog-collar { background: radial-gradient(circle, #c07a35 25%, #8b4513 25%, #8b4513 50%, #c07a35 50%); background-size: 12px 12px; }

        /* ================= 选项按钮组 ================= */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .option-btn {
            padding: 10px 18px;
            border: 1px solid #6b8e23;
            border-radius: 20px;
            background: transparent;
            color: #2c3e22;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .option-btn.active {
            background: #6b8e23;
            color: #fff;
        }

        /* ================= 守护卡 ================= */
        .guard-card {
            width: 100%;
            max-width: 320px;
            padding: 30px 20px;
            background: #fffdf7;
            border-radius: 16px;
            border: 1px solid #e8dcc0;
            box-shadow: 0 10px 30px rgba(90, 70, 40, 0.1);
            text-align: center;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            color: #2c3e22;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .card-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
            margin-top: 15px;
        }
        .card-slogan {
            font-size: 16px;
            color: #2c3e22;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .save-tip {
            font-size: 12px;
            color: #8b7d5a;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- 1. 封面页 -->
    <div class="page active" id="page1">
        <h1 class="main-title">汉釉小守</h1>
        <p class="sub-title">汉代绿釉陶狗 · 民族工艺互动体验</p>
        <button class="btn btn-primary" onclick="showPage(2)">开启守护</button>
    </div>

    <!-- 2. 序章页 -->
    <div class="page" id="page2">
        <h2 class="section-title">物 · 千年陶韵</h2>
        <div class="img-placeholder">
            <!-- 替换为文物实拍图：<img src="图片路径" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"> -->
            可替换文物实拍图
        </div>
        <div class="text-content">
            绿釉立姿陶狗<br>
            汉代（公元前206—公元220年）<br><br>
            中国低温铅釉陶代表器物，<br>
            以铜为釉料着色剂，<br>
            经氧化焰烧成翠色釉面。<br>
            是汉代制陶智慧与市井民俗<br>
            留存至今的实物见证。
        </div>
        <button class="btn" onclick="showPage(3)">上滑继续</button>
    </div>

    <!-- 3. 施釉互动页 -->
    <div class="page" id="page3">
        <h2 class="section-title">工 · 施釉成器</h2>
        <div class="dog-stage">
            <div class="dog glaze-clay" id="dog1">
                <div class="dog-ear left"></div>
                <div class="dog-ear right"></div>
                <div class="dog-head"></div>
                <div class="dog-collar pattern-plain"></div>
                <div class="dog-body"></div>
                <div class="dog-leg fl"></div>
                <div class="dog-leg fr"></div>
                <div class="dog-leg bl"></div>
                <div class="dog-leg br"></div>
            </div>
        </div>
        <p class="text-content" style="margin-bottom:10px;">选择釉色</p>
        <div class="btn-group">
            <button class="option-btn active" data-glaze="clay">素陶胎</button>
            <button class="option-btn" data-glaze="green">铜绿釉</button>
            <button class="option-btn" data-glaze="yellow">黄绿釉</button>
        </div>
        <button class="btn btn-primary" onclick="showPage(4)">下一步 · 饰纹</button>
    </div>

    <!-- 4. 饰纹互动页 -->
    <div class="page" id="page4">
        <h2 class="section-title">纹 · 饰以吉祥</h2>
        <div class="dog-stage">
            <div class="dog glaze-clay" id="dog2">
                <div class="dog-ear left"></div>
                <div class="dog-ear right"></div>
                <div class="dog-head"></div>
                <div class="dog-collar pattern-plain"></div>
                <div class="dog-body"></div>
                <div class="dog-leg fl"></div>
                <div class="dog-leg fr"></div>
                <div class="dog-leg bl"></div>
                <div class="dog-leg br"></div>
            </div>
        </div>
        <p class="text-content" style="margin-bottom:10px;">选择项圈纹饰</p>
        <div class="btn-group">
            <button class="option-btn active" data-pattern="plain">素面项圈</button>
            <button class="option-btn" data-pattern="cloud">卷云纹</button>
            <button class="option-btn" data-pattern="whorl">圆涡纹</button>
        </div>
        <button class="btn btn-primary" onclick="generateCard()">铸成守护</button>
    </div>

    <!-- 5. 生成结果页 -->
    <div class="page" id="page5">
        <h2 class="section-title">成 · 专属守护</h2>
        <div class="guard-card" id="guardCard">
            <div class="card-title">汉釉守护卡</div>
            <div class="dog-stage" style="height: 180px; margin-bottom: 10px;">
                <div class="dog glaze-clay" id="cardDog">
                    <div class="dog-ear left"></div>
                    <div class="dog-ear right"></div>
                    <div class="dog-head"></div>
                    <div class="dog-collar pattern-plain"></div>
                    <div class="dog-body"></div>
                    <div class="dog-leg fl"></div>
                    <div class="dog-leg fr"></div>
                    <div class="dog-leg bl"></div>
                    <div class="dog-leg br"></div>
                </div>
            </div>
            <div class="card-desc" id="cardDesc">釉色：素陶胎<br>纹饰：素面项圈</div>
            <div class="card-slogan" id="cardSlogan">守一方烟火，承千年匠心</div>
        </div>
        <p class="save-tip">长按卡片截图保存到相册</p>
        <button class="btn" onclick="showPage(6)">完成</button>
    </div>

    <!-- 6. 尾章页 -->
    <div class="page" id="page6">
        <div class="text-content" style="line-height: 2.5;">
            一尊陶狗，藏着汉代的烟火<br>
            一份匠心，跨越千年的传承<br><br>
            让文物活起来<br>
            让民族文化被看见
        </div>
        <button class="btn" onclick="showPage(1)">重新体验</button>
    </div>

    <!-- ================= 核心交互逻辑 ================= -->
    <script>
        // 全局状态
        let currentGlaze = 'clay';
        let currentPattern = 'plain';

        const glazeName = { clay: '素陶胎', green: '铜绿釉', yellow: '黄绿釉' };
        const patternName = { plain: '素面项圈', cloud: '卷云纹', whorl: '圆涡纹' };

        const sloganMap = {
            'clay-plain': '守质朴本心，护日常平安',
            'clay-cloud': '祥云绕身，岁岁安宁',
            'clay-whorl': '流转顺遂，福运绵长',
            'green-plain': '翠釉承匠心，烟火守千年',
            'green-cloud': '青云护佑，万事顺意',
            'green-whorl': '翠色生福，圆满安康',
            'yellow-plain': '暖釉藏温，家宅安宁',
            'yellow-cloud': '祥云映瑞，福泽绵长',
            'yellow-whorl': '岁稔年丰，四时顺遂'
        };

        // 1. 页面切换函数（核心！保证手机端能顺畅跳转）
        function showPage(pageNum) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // 显示目标页面
            const target = document.getElementById('page' + pageNum);
            if (target) {
                target.classList.add('active');
                window.scrollTo(0, 0); // 切换后回到顶部
            }
        }

        // 2. 施釉选择监听
        document.querySelectorAll('[data-glaze]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-glaze]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentGlaze = this.dataset.glaze;
                
                // 同步所有陶狗的釉色
                document.querySelectorAll('.dog').forEach(dog => {
                    dog.classList.remove('glaze-clay', 'glaze-green', 'glaze-yellow');
                    dog.classList.add('glaze-' + currentGlaze);
                });
            });
        });

        // 3. 饰纹选择监听
        document.querySelectorAll('[data-pattern]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-pattern]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentPattern = this.dataset.pattern;

                // 同步所有陶狗的项圈纹饰
                document.querySelectorAll('.dog-collar').forEach(collar => {
                    collar.classList.remove('pattern-plain', 'pattern-cloud', 'pattern-whorl');
                    collar.classList.add('pattern-' + currentPattern);
                });
            });
        });

        // 4. 生成守护卡
        function generateCard() {
            // 更新文案
            document.getElementById('cardDesc').innerHTML = 
                `釉色：${glazeName[currentGlaze]}<br>纹饰：${patternName[currentPattern]}`;
            
            const key = `${currentGlaze}-${currentPattern}`;
            document.getElementById('cardSlogan').textContent = sloganMap[key] || '守一方烟火，承千年匠心';

            // 跳转到结果页
            showPage(5);
        }
    </script>
</body>
</html>
