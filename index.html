<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汉釉小守 · 汉代绿釉陶狗文化互动</title>
    <!-- 引入 html2canvas 用于生成图片 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
            background: #f3ebd8; color: #2d2a23;
            min-height: 100vh; display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* ================= 页面容器 ================= */
        .page {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 40px 20px; animation: fadeIn 0.4s ease;
        }
        .page.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= 封面页 ================= */
        .main-title {
            font-size: 44px; font-weight: 700; color: #2c3e22;
            letter-spacing: 10px; writing-mode: vertical-rl; text-orientation: upright; margin-bottom: 20px;
        }
        .sub-title { font-size: 14px; color: #5a6b4e; letter-spacing: 3px; margin-bottom: 60px; }

        /* ================= 通用按钮 ================= */
        .btn {
            padding: 12px 40px; border: 1px solid #2c3e22; border-radius: 30px;
            background: transparent; color: #2c3e22; font-size: 16px;
            letter-spacing: 2px; cursor: pointer; font-family: inherit;
            transition: all 0.3s ease; margin-top: 10px;
        }
        .btn:active { background: #2c3e22; color: #f3ebd8; transform: scale(0.96); }
        .btn-primary { background: #2c3e22; color: #f3ebd8; }
        .btn-primary:active { background: #4a5e3a; }

        /* ================= 标题与文字 ================= */
        .section-title { font-size: 22px; color: #2c3e22; letter-spacing: 4px; margin-bottom: 30px; font-weight: 600; }
        .text-content { font-size: 15px; line-height: 2.2; color: #3d3a31; text-align: center; max-width: 320px; margin-bottom: 30px; }

        /* ================= 文物图片专属舞台 ================= */
        .photo-stage {
            width: 240px; height: 300px; position: relative;
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(90, 70, 40, 0.15);
            background: #eae0cc; /* 图片背景底色 */
        }
        .photo-stage img {
            width: 100%; height: 100%; object-fit: cover;
            transition: filter 0.5s ease;
        }

        /* 施釉滤镜效果 (基于原图进行颜色变换) */
        /* 素陶胎：去绿，加暖褐 */
        .glaze-clay img { filter: sepia(0.9) saturate(0.6) brightness(1.1); }
        /* 铜绿釉：保留原始绿色并增强 */
        .glaze-green img { filter: saturate(1.2) brightness(1.0); }
        /* 黄绿釉：色相偏移，偏黄 */
        .glaze-yellow img { filter: hue-rotate(35deg) saturate(1.4) brightness(1.05); }

        /* ================= 项圈纹饰叠加 ================= */
        /* 图片里狗脖子上已经有项圈了，我们用CSS在上面叠加装饰 */
        .collar-overlay {
            position: absolute;
            top: 57%; /* 根据图片实际比例微调 */
            left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 10px; border-radius: 5px;
            z-index: 5; transition: all 0.3s ease;
            pointer-events: none; /* 不阻挡点击 */
        }
        /* 默认素面 */
        .collar-overlay.pattern-plain { background: transparent; opacity: 0; }
        /* 卷云纹 */
        .collar-overlay.pattern-cloud { 
            background: repeating-linear-gradient(90deg, transparent 0px, transparent 6px, #d4af37 6px, #d4af37 10px, transparent 10px, transparent 16px);
            opacity: 0.9;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        /* 圆涡纹 */
        .collar-overlay.pattern-whorl { 
            background: radial-gradient(circle, #d4af37 30%, transparent 35%);
            background-size: 10px 10px;
            opacity: 0.9;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        /* ================= 选项按钮组 ================= */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .option-btn {
            padding: 10px 18px; border: 1px solid #6b8e23; border-radius: 20px;
            background: transparent; color: #2c3e22; font-size: 14px; font-family: inherit;
            transition: all 0.3s ease;
        }
        .option-btn.active { background: #6b8e23; color: #fff; }

        /* ================= 守护卡 ================= */
        .guard-card {
            width: 100%; max-width: 320px; padding: 20px 15px;
            background: #fffdf7; border-radius: 16px;
            border: 1px solid #e8dcc0; box-shadow: 0 10px 30px rgba(90, 70, 40, 0.1);
            text-align: center; margin-bottom: 20px; position: relative;
        }
        .card-title { font-size: 18px; color: #2c3e22; margin-bottom: 15px; letter-spacing: 2px; }
        .card-desc { font-size: 13px; color: #555; line-height: 1.8; margin-top: 10px; }
        .card-slogan { font-size: 15px; color: #2c3e22; font-weight: 600; margin-top: 8px; letter-spacing: 1px; }
        .save-tip { font-size: 12px; color: #8b7d5a; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- 1. 封面页 -->
    <div class="page active" id="page1">
        <h1 class="main-title">汉釉小守</h1>
        <p class="sub-title">汉代绿釉陶狗 · 民族工艺互动体验</p>
        <button class="btn btn-primary" onclick="showPage(2)">开启守护</button>
    </div>

    <!-- 2. 序章页 -->
    <div class="page" id="page2">
        <h2 class="section-title">物 · 千年陶韵</h2>
        <!-- 这里替换为你的文物实拍图 -->
        <div class="photo-stage">
            <img src="dog.jpg" alt="汉代绿釉陶狗">
        </div>
        <div class="text-content">
            绿釉立姿陶狗<br>
            汉代（公元前206—公元220年）<br><br>
            中国低温铅釉陶代表器物，<br>
            以铜为釉料着色剂，<br>
            经氧化焰烧成翠色釉面。<br>
            是汉代制陶智慧与市井民俗<br>
            留存至今的实物见证。
        </div>
        <button class="btn" onclick="showPage(3)">继续</button>
    </div>

    <!-- 3. 施釉互动页 -->
    <div class="page" id="page3">
        <h2 class="section-title">工 · 施釉成器</h2>
        <div class="photo-stage" id="dogStage3">
            <img src="dog.jpg" alt="汉代绿釉陶狗" id="dogImage3">
            <div class="collar-overlay pattern-plain" id="collar3"></div>
        </div>
        <p class="text-content" style="margin-bottom:10px;">选择釉色</p>
        <div class="btn-group">
            <button class="option-btn active" data-glaze="clay">素陶胎</button>
            <button class="option-btn" data-glaze="green">铜绿釉</button>
            <button class="option-btn" data-glaze="yellow">黄绿釉</button>
        </div>
        <button class="btn btn-primary" onclick="showPage(4)">下一步 · 饰纹</button>
    </div>

    <!-- 4. 饰纹互动页 -->
    <div class="page" id="page4">
        <h2 class="section-title">纹 · 饰以吉祥</h2>
        <div class="photo-stage" id="dogStage4">
            <img src="dog.jpg" alt="汉代绿釉陶狗" id="dogImage4">
            <div class="collar-overlay pattern-plain" id="collar4"></div>
        </div>
        <p class="text-content" style="margin-bottom:10px;">选择项圈纹饰</p>
        <div class="btn-group">
            <button class="option-btn active" data-pattern="plain">素面项圈</button>
            <button class="option-btn" data-pattern="cloud">卷云纹</button>
            <button class="option-btn" data-pattern="whorl">圆涡纹</button>
        </div>
        <button class="btn btn-primary" onclick="generateCard()">铸成守护</button>
    </div>

    <!-- 5. 生成结果页 -->
    <div class="page" id="page5">
        <h2 class="section-title">成 · 专属守护</h2>
        
        <!-- 需要生成图片的区域 -->
        <div class="guard-card" id="guardCard">
            <div class="card-title">汉釉守护卡</div>
            <div class="photo-stage" style="height: 200px; width: 160px; margin: 0 auto 10px auto; box-shadow: none; border-radius: 8px;">
                <img src="dog.jpg" alt="汉代绿釉陶狗" id="cardImage">
                <div class="collar-overlay" id="cardCollar"></div>
            </div>
            <div class="card-desc" id="cardDesc">釉色：素陶胎<br>纹饰：素面项圈</div>
            <div class="card-slogan" id="cardSlogan">守一方烟火，承千年匠心</div>
            <div style="margin-top: 15px; font-size: 10px; color: #999; letter-spacing: 1px;">扫码体验 · 民族工艺互动</div>
        </div>
        
        <!-- 保存按钮和提示 -->
        <button class="btn btn-primary" onclick="saveCard()" style="margin-top: 10px;">保存守护卡</button>
        <p class="save-tip">若无法直接保存，请长按图片保存到相册</p>
        
        <button class="btn" onclick="showPage(6)" style="margin-top: 20px;">完成</button>
    </div>

    <!-- 6. 尾章页 -->
    <div class="page" id="page6">
        <div class="text-content" style="line-height: 2.5;">
            一尊陶狗，藏着汉代的烟火<br>
            一份匠心，跨越千年的传承<br><br>
            让文物活起来<br>
            让民族文化被看见
        </div>
        <button class="btn" onclick="showPage(1)">重新体验</button>
    </div>

    <!-- ================= 核心交互逻辑 ================= -->
    <script>
        // 全局状态
        let currentGlaze = 'clay';
        let currentPattern = 'plain';

        const glazeName = { clay: '素陶胎', green: '铜绿釉', yellow: '黄绿釉' };
        const patternName = { plain: '素面项圈', cloud: '卷云纹', whorl: '圆涡纹' };

        const sloganMap = {
            'clay-plain': '守质朴本心，护日常平安',
            'clay-cloud': '祥云绕身，岁岁安宁',
            'clay-whorl': '流转顺遂，福运绵长',
            'green-plain': '翠釉承匠心，烟火守千年',
            'green-cloud': '青云护佑，万事顺意',
            'green-whorl': '翠色生福，圆满安康',
            'yellow-plain': '暖釉藏温，家宅安宁',
            'yellow-cloud': '祥云映瑞，福泽绵长',
            'yellow-whorl': '岁稔年丰，四时顺遂'
        };

        // 1. 页面切换函数
        function showPage(pageNum) {
            document.querySelectorAll('.page').forEach(page => { page.classList.remove('active'); });
            const target = document.getElementById('page' + pageNum);
            if (target) {
                target.classList.add('active');
                window.scrollTo(0, 0);
            }
        }

        // 2. 施釉选择监听 (现在通过CSS滤镜作用于图片)
        document.querySelectorAll('[data-glaze]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-glaze]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentGlaze = this.dataset.glaze;
                
                // 作用于所有舞台的图片
                document.querySelectorAll('.photo-stage').forEach(stage => {
                    stage.classList.remove('glaze-clay', 'glaze-green', 'glaze-yellow');
                    stage.classList.add('glaze-' + currentGlaze);
                });
            });
        });

        // 3. 饰纹选择监听 (作用于叠加的项圈图层)
        document.querySelectorAll('[data-pattern]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-pattern]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentPattern = this.dataset.pattern;

                document.querySelectorAll('.collar-overlay').forEach(collar => {
                    collar.classList.remove('pattern-plain', 'pattern-cloud', 'pattern-whorl');
                    collar.classList.add('pattern-' + currentPattern);
                });
            });
        });

        // 4. 生成守护卡
        function generateCard() {
            document.getElementById('cardDesc').innerHTML = 
                `釉色：${glazeName[currentGlaze]}<br>纹饰：${patternName[currentPattern]}`;
            
            const key = `${currentGlaze}-${currentPattern}`;
            document.getElementById('cardSlogan').textContent = sloganMap[key] || '守一方烟火，承千年匠心';

            // 同步卡片的视觉效果
            const cardStage = document.getElementById('guardCard').querySelector('.photo-stage');
            cardStage.classList.remove('glaze-clay', 'glaze-green', 'glaze-yellow');
            cardStage.classList.add('glaze-' + currentGlaze);

            const cardCollar = document.getElementById('cardCollar');
            cardCollar.classList.remove('pattern-plain', 'pattern-cloud', 'pattern-whorl');
            cardCollar.classList.add('pattern-' + currentPattern);

            showPage(5);
        }

        // 5. 保存图片功能（利用 html2canvas）
        function saveCard() {
            const cardElement = document.getElementById('guardCard');
            const saveBtn = document.querySelector('.btn-primary');
            const oldText = saveBtn.innerText;
            saveBtn.innerText = '生成中...';
            
            html2canvas(cardElement, {
                scale: 2, // 提升清晰度，适合数媒大赛展示
                backgroundColor: '#fffdf7',
                useCORS: true
            }).then(canvas => {
                saveBtn.innerText = oldText;
                const imgData = canvas.toDataURL('image/png');
                
                // 为了避免手机浏览器直接下载被拦截，我们弹出一个新页面展示图片，引导用户长按保存
                const newWindow = window.open();
                if (newWindow) {
                    newWindow.document.write(`
                        <html>
                        <head><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
                        <body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f3ebd8;">
                            <img src="${imgData}" style="max-width:100%;max-height:100%;object-fit:contain;" alt="守护卡">
                            <div style="position:fixed; bottom:20px; color:#2c3e22; font-size:14px; text-align:center; width:100%; font-family:sans-serif;">长按上方图片保存到相册</div>
                        </body>
                        </html>
                    `);
                    newWindow.document.title = "长按图片保存到相册";
                } else {
                    // 备用方案
                    const link = document.createElement('a');
                    link.download = '汉釉守护卡.png';
                    link.href = imgData;
                    link.click();
                    alert('图片已生成，如未自动下载，请长按卡片截图保存。');
                }
            }).catch(err => {
                saveBtn.innerText = oldText;
                alert('生成图片失败，请长按卡片截图保存。');
            });
        }
    </script>
</body>
</html>
